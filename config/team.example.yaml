team:
  business_analyst:
    count: 1
    responsibilities: [requirements, user_stories, acceptance_criteria, clarification_log]
  product_owner:
    count: 1
    responsibilities: [backlog_priority, scope_approval, requirement_traceability, business_acceptance]
  solution_architect:
    count: 1
    responsibilities: [solution_design, database_design, api_contracts, tdd, security_and_coding_standards]
  developers:
    count: 4
    responsibilities: [implementation, unit_tests, code_review_response, bug_fixes]
  qa_lead:
    count: 1
    responsibilities: [automation_architecture, code_review, conflict_resolution, duplicate_coverage_review, qa_signoff]
  qa_engineers:
    count: 3
    responsibilities: [test_design, playwright_python, api_testing_pytest, regression, rag_evaluation_python, defect_evidence]
  scrum_master:
    count: 1
    responsibilities: [sprint_status, assignments, blockers, workload_tracking, evidence_based_reporting]

work_allocation:
  method: capacity_and_complexity_weighted
  require_explicit_owner: true
  require_dependencies: true
  shared_file_edits_require_owner_approval: true
  agent_self_approval_for_pr: false
  scrum_master_can_override_quality_gates: false

parallelism:
  enabled: false # Turn on after branch/worktree isolation and contracts are implemented.
  max_developer_workers: 4
  max_qa_workers: 3
