project:
  id: SAMPLE-APP
  name: Sample Business Application
  description: Replace this with the target application's purpose.

repository:
  provider: github
  default_branch: main
  protected_branches:
    - main
  require_pull_request: true
  require_code_owner_review: true

technology:
  language: python
  frontend: streamlit
  backend: fastapi
  database: postgresql
  database_access: sqlalchemy

automation:
  language: python
  unit_and_api: pytest
  browser: playwright-python
  rag_evaluation: deepeval-or-ragas

workflow:
  require_ba_approval: true
  require_product_owner_approval: true
  require_architecture_approval: true
  require_qa_lead_signoff: true
  require_product_acceptance: true

quality_gates:
  unit_tests: required
  api_tests: required
  ui_tests: required
  rag_evaluations: conditional
  security_checks: required
  regression_tests: required
  no_unresolved_critical_or_high_defects: true

release:
  staging_approval: required
  production_approval: required
  automatic_production_deployment: false
