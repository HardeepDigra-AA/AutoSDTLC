[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderhub-enterprise-platform"
version = "2.0.0"
description = "Enterprise E-Commerce Platform with Page Object Model Playwright Test Automation Framework."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "QA & DevOps Engineering Team" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "playwright>=1.48",
    "pytest>=8.0",
    "pytest-playwright>=0.6"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "testing*"]

[tool.pytest.ini_options]
testpaths = ["testing/tests_e2e"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I", "B", "UP"]
ignore = ["E501"]
