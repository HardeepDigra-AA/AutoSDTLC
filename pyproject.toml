[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-orchestrator"
version = "0.5.0"
description = "A governed, plug-and-play multi-agent SDLC and software testing orchestration framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - replace with your chosen license before external distribution" }
authors = [{ name = "Project Team" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "streamlit>=1.40"]
qa = ["httpx>=0.27", "playwright>=1.48", "pytest-playwright>=0.6"]
rag = ["deepeval>=2.0", "ragas>=0.2"]

[project.scripts]
ai-sdlc = "ai_sdlc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
